# ~/.tmux.conf — sensible defaults (tmux 3.x)

# --- General ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"   # truecolor passthrough
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10                     # no lag on Esc (vim)
set -g focus-events on
set -g base-index 1                        # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g display-time 2000
setw -g aggressive-resize on
setw -g mode-keys vi

# --- Prefix: keep C-b, add C-a as secondary --------------------------------
set -g prefix2 C-a
bind C-a send-prefix -2

# --- Keybindings -----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "config reloaded"

# split in current path with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# --- Status bar (blue accent; red only when tmux runs as root) -------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 40
set -g status-left "#[bg=colour31,fg=colour231,bold] #(whoami)@#h #[default] "
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour250]%H:%M "
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "#[bg=colour31,fg=colour231,bold] #I:#W#F "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"
set -g message-style "bg=colour31,fg=colour231"

if-shell '[ "$(id -u)" -eq 0 ]' {
  set -g status-left "#[bg=colour160,fg=colour231,bold] ROOT@#h #[default] "
  setw -g window-status-current-format "#[bg=colour160,fg=colour231,bold] #I:#W#F "
  set -g pane-active-border-style "fg=colour160"
  set -g message-style "bg=colour160,fg=colour231"
}

